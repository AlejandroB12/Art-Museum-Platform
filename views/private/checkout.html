<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>DoArt Magic | Checkout</title>
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico">
    <link rel="stylesheet" href="/styles/theme.css">
    <link rel="stylesheet" href="/styles/checkout-style.css">
</head>
<body>
<div class="checkout-overlay">
    <div class="checkout-modal">
        <a href="/catalog/artwork" class="checkout-close">&times;</a>
        <h2>Confirmar Adquisici&oacute;n</h2>

        <div class="obra-resumen">
            <img id="img-obra" src="" class="obra-img" alt="Miniatura">
            <div>
                <div id="titulo-obra" class="obra-title">Cargando obra...</div>
                <div id="artista-obra" class="obra-author">Artista</div>
                <div id="precio-obra" class="obra-price">0$</div>
            </div>
        </div>

        <div class="section-label">Informaci&oacute;n de Env&iacute;o</div>
        <div class="datos-usuario" id="datos-envio">
            <div class="user-data-loading">Cargando tus datos...</div>
        </div>

        <div class="section-label">Tarjeta</div>
        <div id="checkout-card-display" class="checkout-card-info">Cargando tarjeta...</div>

        <form id="form-pago" novalidate>
            <div class="section-label">C&oacute;digo de Seguridad</div>
            <input type="text" id="codigo-membresia" placeholder="C&oacute;digo de seguridad de membres&iacute;a" minlength="6" maxlength="6" required>
            <div id="error-msg" class="error-msg-checkout"></div>
            <button type="submit" class="btn-pagar">Pagar Ahora</button>
        </form>

        <div class="secure-badge">
            Pago 100% seguro y cifrado. Museo Contempor&aacute;neo 2026.
        </div>
    </div>
</div>

<script src="/scripts/theme-switcher.js"></script>
<script src="/controllers/authController.js"></script>
<script src="/controllers/userController.js"></script>
<script src="/controllers/checkoutController.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {

        // --- 0. VERIFICAR SESIÓN ---
        try {
            const sesionData = await AuthController.checkSession();
            if (!sesionData.autenticado) {
                alert("Debes iniciar sesión para adquirir una obra.");
                window.location.href = "/login";
                return;
            }
        } catch (e) {
            console.error("Error verificando sesión:", e);
            window.location.href = "/login";
            return;
        }

        // --- 1. CARGAR OBRA DESDE LOCALSTORAGE ---
        const data = localStorage.getItem('obraSeleccionada');
        if (!data) {
            alert("No se ha seleccionado ninguna obra.");
            window.location.href = "/catalog/artwork";
            return;
        }
        const obra = JSON.parse(data);
        document.getElementById('img-obra').src = obra.imagen || '';
        document.getElementById('titulo-obra').innerText = obra.nombre || '';
        document.getElementById('artista-obra').innerText = obra.artista || '';
        document.getElementById('precio-obra').innerText = obra.precio ? `$${Number(obra.precio).toLocaleString()}` : '0$';

        // --- 2. CARGAR DATOS DE ENVÍO + TARJETA ---
        async function cargarUsuario() {
            try {
                const user = await UserController.getShippingPaymentData();
                const el = document.getElementById('datos-envio');
                if (!user) {
                    el.innerHTML = '<div style="color:#ffaa00;">No has registrado tus datos de envío. <a href="/dashboard" style="color:var(--accent);">Completar dirección</a></div>';
                } else {
                    el.innerHTML = `
                        <div style="font-weight:bold;color:var(--text-primary);">${user.Nombre} ${user.Apellido}</div>
                        <div style="color:var(--text-muted);">Dirección: ${user.Calle || 'No registrada'}</div>
                        <div style="color:var(--text-muted);">${user.Parroquia || ''}${user.Parroquia && user.Municipio ? ', ' : ''}${user.Municipio || ''}</div>
                        <a href="/dashboard" style="font-size:0.7rem;color:var(--accent);">Editar dirección</a>
                    `;
                }
            } catch (err) {
                console.error("Error cargando datos de envío:", err);
                document.getElementById('datos-envio').innerHTML = '<div style="color:#ff4444;">Error al cargar datos de envío.</div>';
            }

            try {
                const card = await CheckoutController.getCard();
                const el = document.getElementById('checkout-card-display');
                if (card && card.numero) {
                    const last4 = card.numero.replace(/\s/g, '').slice(-4);
                    el.innerHTML = `
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
                        <span>**** **** **** ${last4}</span>
                        <span class="checkout-card-expiry">${card.expiracion || ''}</span>
                    `;
                } else {
                    el.innerHTML = '<span style="color:var(--text-dim);">No hay tarjeta registrada. A\u00f1ade una en Tu Tarjeta del panel.</span>';
                }
            } catch (err) { console.error("Error cargando tarjeta:", err); }
        }

        document.getElementById('codigo-membresia').addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '');
        });

        function mostrarError(msg) {
            const el = document.getElementById('error-msg');
            el.innerText = msg; el.style.display = 'block';
        }

        document.getElementById('form-pago').addEventListener('submit', async (e) => {
            e.preventDefault();
            document.getElementById('error-msg').style.display = 'none';
            const codigo = document.getElementById('codigo-membresia').value;

            if (!/^\d{6}$/.test(codigo)) { mostrarError("El c\u00f3digo de seguridad de membres\u00eda debe tener 6 d\u00edgitos."); return; }

            const btn = e.target.querySelector('.btn-pagar');
            if (!obra || !obra.id_Obra) { mostrarError("Error: No se seleccion\u00f3 ninguna obra v\u00e1lida."); return; }

            btn.innerText = "PROCESANDO..."; btn.disabled = true;
            try {
                const resultado = await CheckoutController.confirmReservation({ id_obra: Number(obra.id_Obra) });
                if (resultado && resultado.success !== false) {
                    alert("\u00a1Pago procesado y reserva guardada!");
                    localStorage.removeItem('obraSeleccionada');
                    window.location.href = "/catalog/artwork";
                } else {
                    mostrarError(resultado?.error || resultado?.message || "No se pudo procesar el pago");
                    btn.innerText = "Pagar Ahora"; btn.disabled = false;
                }
            } catch (err) {
                console.error("Error en pago:", err);
                mostrarError(err.message || "Error de conexi\u00f3n con el servidor.");
                btn.innerText = "Pagar Ahora"; btn.disabled = false;
            }
        });

        cargarUsuario();
    });
</script>
</body>
</html>
