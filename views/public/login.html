<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Museo Virtual</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/theme.css">
    <link rel="stylesheet" href="/styles/login-style.css">
    <link rel="stylesheet" href="/styles/footer.css">
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico">
</head>
<body>
    <div class="left-panel">

        <div class="brand-icon-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                <line x1="12" y1="2" x2="12" y2="22"></line>
                <line x1="2" y1="12" x2="22" y2="12"></line>
                <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
                <line x1="4.93" y1="19.07" x2="19.07" y2="4.93"></line>
            </svg>
        </div>

        <div class="content-wrap">
            <h1 class="title">
                <span id="typewriter-text" style="white-space: pre-line;"></span><span id="typewriter-cursor">|</span>
            </h1>
            <p class="desc">
                Explora, aprende y déjate inspirar por el arte contemporáneo.
            </p>
        </div>

        <div class="footer">
            <a href="https://github.com/KelvysB13/Art-Museum-Platform" target="_blank" rel="noopener noreferrer" class="github-link">
                <svg fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                </svg>
            </a>
            <div class="copyright">
                &copy; 2026 DOART MAGIC. ALL RIGHTS RESERVED.
            </div>
        </div>
    </div>

    <div class="right-panel">
        <div class="form-container">
            <div class="logo-wrap">
                <a href="/home"><img src="/images/DoArt_Magic_Logo.png" alt="DoArt Magic"></a>
            </div>

            <form class="login-form" id="loginForm">
                <div>
                    <h2 class="welcome-title">INGRESE SUS CREDENCIALES</h2>
                    <p class="welcome-sub">
                        ¿No tienes una cuenta?
                        <a href="/register">Regístrate aquí</a>.
                    </p>
                </div>

                <div id="error-message" class="mensaje" style="display: none;"></div>

                <div class="form-group email" id="email-group">
                    <svg class="input-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                    </svg>
                    <input type="email" id="username" name="username" placeholder="Correo Electrónico" required>
                </div>

                <div class="form-group password" id="password-group">
                    <svg class="input-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                    </svg>
                    <input type="password" id="password" name="password" placeholder="Contraseña" minlength="6" required>
                </div>

                <div class="remember-row">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Recordar Sesión</label>
                </div>

                <div class="buttons-wrap">
                    <button type="submit" class="btn-primary">
                        Iniciar Sesión
                    </button>
                </div>
            </form>

            <div class="forgot-row">
                ¿Olvidaste tu contraseña?
                <a href="/recovery">Haz clic aquí</a>.
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const msg = document.getElementById('error-message');
            const groups = document.querySelectorAll('.form-group');
            groups.forEach(g => g.classList.remove('error'));
            msg.style.display = 'none';

            const body = {
                email: document.getElementById('username').value,
                password: document.getElementById('password').value
            };

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = '/private/user-dashboard.html';
                    return;
                }
                const errMsg = typeof data.error === 'string' ? data.error : (data.error?.[0]?.message || 'Credenciales erróneas, vuelva a intentar.');
                msg.textContent = errMsg;
            } catch {
                msg.textContent = 'Error de conexión con el servidor';
            }

            groups.forEach(g => g.classList.add('error'));
            msg.style.display = 'block';

            const inputs = document.querySelectorAll('.form-group input');
            inputs.forEach(input => {
                input.addEventListener('input', () => {
                    groups.forEach(gr => gr.classList.remove('error'));
                    msg.style.display = 'none';
                }, { once: true });
            });
        });

        const text = "Donde el arte \ncobra vida.";
        const el = document.getElementById('typewriter-text');
        let i = 0;
        let deleting = false;

        function typeWriter() {
            if (!deleting) {
                if (i < text.length) {
                    el.textContent += text.charAt(i);
                    i++;
                    setTimeout(typeWriter, 55 + Math.random() * 45);
                } else {
                    deleting = true;
                    setTimeout(typeWriter, 1500);
                }
            } else {
                if (i > 0) {
                    el.textContent = text.substring(0, i - 1);
                    i--;
                    setTimeout(typeWriter, 30 + Math.random() * 25);
                } else {
                    deleting = false;
                    setTimeout(typeWriter, 500);
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => setTimeout(typeWriter, 400));
    </script>
    <script src="/scripts/theme-switcher.js"></script>
</body>
</html>
