<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo | MUSEO CONTEMPORANEO</title>
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico">
    <link rel="stylesheet" href="/styles/art-catalog-style.css">
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico">
</head>

<body>

    <div id="main-content">
        <nav class="navbar">
            <a href="/home" class="logo"> ARTE CONTEMPORANEO</a>

            <div class="nav-container">
                <ul class="nav-links">
                    <li><a href="/catalog/artwork">Catálogo</a></li>
                    <li><a href="/catalog/artist">Artistas</a></li>
                </ul>

                <div class="auth-buttons" id="auth-buttons">
                    <a href="/login" class="btn-login">INICIAR SESION</a>
                    <a href="/register" class="btn-register">REGISTRARTE</a>
                </div>
            </div>
        </nav>

        <header class="catalog-header">
            <h2>Nuestro Catálogo</h2>
            <p class="catalog-subtitle">Desde pinturas abstractas, hasta hermosas esculturas</p>
        </header>

        <div class="search-container">
            <input type="text" id="buscador"
                placeholder="Buscar por nombre, artista o describir... ej: escultura abstracta naranja"
                class="search-input" onkeyup="buscarObras(this.value)">
        </div>

        <div class="filter-container">
            <div class="filter-group">
                <label>Orden Precio</label>
                <select id="sortPrice">
                    <option value="asc">Menor a Mayor</option>
                    <option value="desc">Mayor a Menor</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Género</label>
                <select id="filterGenre">
                    <option value="all">Todos los Géneros</option>
                    <option value="Pintura">Pintura</option>
                    <option value="Orfebreria">Orfebrería</option>
                    <option value="Escultura">Escultura</option>
                    <option value="Ceramica">Cerámica</option>
                    <option value="Fotografia">Fotografía</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Autor</label>
                <select id="filterAuthor">
                    <option value="all">Todos los Autores</option>
                </select>
            </div>
        </div>

        <div class="gallery-grid" id="gallery"></div>

        <div class="pagination" id="pagination"></div>

        <footer>
            &copy; 2026 MUSEO CONTEMPORANEO. TODOS LOS DERECHOS RESERVADOS.
        </footer>
    </div>

    <div id="obra-modal" class="modal">
        <span class="cerrar-modal" onclick="cerrarModal()">&times;</span>
        <div class="modal-contenido">
            <img id="modal-imagen" src="" alt="Obra expandida">
            <div class="modal-info-panel">
                <h2 id="modal-titulo"></h2>
                <p id="modal-artista"></p>
                <hr class="modal-divider">
                <div id="modal-detalles-tecnicos" class="modal-tech-details">
                </div>
                <hr class="modal-divider">
                <h3 class="suggestions-section">
                    Te puede interesar</h3>
                <div id="modal-relacionadas" class="modal-related">
                    <p>Cargando obras relacionadas...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="/controllers/authController.js"></script>
    <script src="/controllers/catalogController.js"></script>
    <script src="/controllers/recommendationsController.js"></script>

    <script>
        const gallery = document.getElementById('gallery');
        const modal = document.getElementById('obra-modal');
        let currentPage = 1;
        const ITEMS_PER_PAGE = 12;
        let allObras = [];
        let isSearching = false;
        let totalObras = 0;

        function abrirModal(img, titulo, artista, detalles, genero, idObra) {
            document.getElementById('modal-imagen').src = img;
            document.getElementById('modal-titulo').innerText = titulo;
            document.getElementById('modal-artista').innerText = `Por ${artista}`;
            document.getElementById('modal-detalles-tecnicos').innerHTML = detalles;

            modal.style.display = 'flex';
            document.body.classList.add('modal-active');

            // REGISTRAR ACTIVIDAD SIEMPRE (con o sin sesión)
            RecommendationsController.registerActivity({
                idUsuario: 9999,
                idObra: parseInt(idObra) || idObra,
                tipo: 'vista_detalle',
                duracion: 0
            }).catch(() => { });

            // CARGAR RECOMENDACIONES
            cargarSimilaresIA(idObra);
        }

        async function cargarSimilaresIA(idObra) {
            const container = document.getElementById('modal-relacionadas');
            container.innerHTML = '<p style="color: #555;">Cargando...</p>';
            try {
                const obras = await RecommendationsController.getBySimilarity(idObra);
                if (obras.length === 0) {
                    container.innerHTML = '<p style="color: #555;">No se encontraron obras similares.</p>';
                    return;
                }

                // Eliminar duplicados por ID y excluir la obra actual
                const visto = new Set();
                const unicas = obras.filter(o => {
                    const id = Number(o.idObra);
                    if (id === Number(idObra) || visto.has(id)) return false;
                    visto.add(id);
                    return true;
                });

                if (unicas.length === 0) {
                    container.innerHTML = '<p style="color: #555;">No se encontraron obras similares.</p>';
                    return;
                }

                container.innerHTML = unicas.map(o => {
                    const motivo = o.label || 'Composición afín';

                    return `<div style="padding: 10px 0; border-bottom: 1px solid #1a1a1a; display: flex; align-items: center; gap: 12px; cursor: pointer;" 
                  onclick="cerrarModal(); setTimeout(() => abrirObraPorId(${o.idObra}), 300);" 
                  onmouseover="this.style.background='#111'" 
                  onmouseout="this.style.background='transparent'">
                <div style="width: 45px; height: 45px; border-radius: 3px; flex-shrink: 0; background-image: url('${o.fotografia || ''}'); background-size: cover; background-position: center; background-color: #1a1a1a;">
                </div>
                <div style="flex: 1; min-width: 0;">
                    <span style="color: #ccc; font-size: 0.85rem; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${o.nombre}</span>
                    <span style="color: #888; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.5px;">${motivo}</span>
                </div>
                <span style="color: #00ff00; font-size: 0.8rem; flex-shrink: 0;">$${Number(o.precio).toLocaleString()}</span>
            </div>`;
                }).join('');
            } catch (e) {
                console.error('Error cargando similares:', e);
                container.innerHTML = '<p style="color: #555;">No se pudieron cargar sugerencias.</p>';
            }
        }

        async function abrirObraPorId(idObra) {
            try {
                const obra = await CatalogController.getById(idObra);
                const imgSource = obra.fotografia || obra.imagen_url || '/assets/images/placeholder.jpg';
                const artistaNombreCompleto = (obra.artista_nombre && obra.artista_apellido) ? obra.artista_nombre + ' ' + obra.artista_apellido : obra.AutorNombre || '';
                const detallesHTML = construirDetallesTecnicos(obra);
                abrirModal(imgSource, obra.nombre, artistaNombreCompleto, detallesHTML, obra.genero_nombre || obra.GeneroNombre || '', obra.id_obra || obra._id);
            } catch (e) {
                console.error('Error abriendo obra:', e);
            }
        }

        async function cargarRelacionadas(genero) {
            const container = document.getElementById('modal-relacionadas');
            if (!genero) {
                container.innerHTML = '<p>Selecciona una obra para ver sugerencias.</p>';
                return;
            }
            container.innerHTML = '<p>Cargando...</p>';
            try {
                const obras = await RecommendationsController.getByGenre(genero);
                if (obras.length === 0) {
                    container.innerHTML = '<p>No hay otras obras disponibles de este género.</p>';
                    return;
                }
                container.innerHTML = obras.map(o =>
                    `<div style="padding: 8px 0; border-bottom: 1px solid #1a1a1a; display: flex; justify-content: space-between;">
                    <span>${o.Nombre}</span>
                    <span style="color: #00ff00;">$${Number(o.Precio).toLocaleString()}</span>
                </div>`
                ).join('');
            } catch (e) {
                console.error('Error cargando relacionadas:', e);
                container.innerHTML = '<p style="color: #666;">No se pudieron cargar sugerencias.</p>';
            }
        }

        function cerrarModal() {
            modal.style.display = 'none';
            document.body.classList.remove('modal-active');
        }

        window.onclick = function (event) {
            if (event.target == modal) cerrarModal();
        }

        // Función para construir detalles técnicos según el género
        function construirDetallesTecnicos(obra) {
            const genero = obra.genero_nombre || obra.GeneroNombre || '';
            const precio = obra.precio_formateado || obra.PrecioFormateado || '';
            const fecha = obra.fecha_creacion || obra.Fecha_creacion || 'No especificada';

            let detalles = `
            <p><strong>GÉNERO:</strong> ${genero}</p>
            <p><strong>PRECIO:</strong> ${precio}</p>
            <p><strong>FECHA CREACIÓN:</strong> ${fecha}</p>
        `;

            // Detalles específicos por género
            const tp = obra.Tecnica_Principal;
            if (tp) {
                detalles += `
                <p><strong>TÉCNICA PRINCIPAL:</strong> ${tp}</p>
                <p><strong>SOPORTE:</strong> ${obra.Soporte_Base}</p>
                <p><strong>REQUIERE ENMARCADO:</strong> ${obra.Requiere_Enmarcado ? 'Sí' : 'No'}</p>
            `;
            }

            if (obra.Material_Predominante) {
                detalles += `
                <p><strong>MATERIAL PREDOMINANTE:</strong> ${obra.Material_Predominante}</p>
                <p><strong>REQUIERE PEDESTAL:</strong> ${obra.Requiere_Pedestal ? 'Sí' : 'No'}</p>
                <p><strong>CLASIFICACIÓN ESPACIO:</strong> ${obra.Clasificacion_Espacio}</p>
            `;
            }

            if (obra.Formato_Origen) {
                detalles += `
                <p><strong>FORMATO ORIGEN:</strong> ${obra.Formato_Origen}</p>
                <p><strong>TIPO IMPRESIÓN:</strong> ${obra.Tipo_Impresion_Estandar}</p>
                <p><strong>REQUIERE REVELADO QUÍMICO:</strong> ${obra.Requiere_Revelado_Quimico ? 'Sí' : 'No'}</p>
            `;
            }

            if (obra.Metal_Base_Dominante) {
                detalles += `
                <p><strong>METAL BASE:</strong> ${obra.Metal_Base_Dominante}</p>
                <p><strong>KILATAJE:</strong> ${obra.Kilataje_Estandar}</p>
                <p><strong>CERTIFICADO AUTENTICIDAD:</strong> ${obra.Requeres_Certificado_Autenticidad ? 'Incluido' : 'No incluye'}</p>
            `;
            }

            if (obra.Tecnica_Acabado) {
                detalles += `
                <p><strong>TÉCNICA ACABADO:</strong> ${obra.Tecnica_Acabado}</p>
                <p><strong>TIPO ARCILLA:</strong> ${obra.Tipo_Arcilla_Base}</p>
                <p><strong>TEMPERATURA COCCIÓN:</strong> ${obra.Temperatura_Coccion_Promedio_Celsius}°C</p>
            `;
            }

            return detalles;
        }

        async function cargarFiltros() {
            try {
                const artistas = await CatalogController.getArtists();
                const select = document.getElementById('filterAuthor');
                artistas.forEach(a => {
                    const opt = document.createElement('option');
                    opt.value = a.id_artista;
                    opt.textContent = `${a.nombre} ${a.apellido}`;
                    select.appendChild(opt);
                });
            } catch (error) {
                console.error("Error cargando filtros:", error);
            }
        }

        function renderCards(obras) {
            gallery.innerHTML = '';
            if (obras.length === 0) {
                gallery.innerHTML = '<p style="text-align:center; width:100%; color:#444;">No hay piezas disponibles.</p>';
                return;
            }
            obras.forEach(obra => {
                const imgSource = obra.fotografia || obra.imagen_url || '/assets/images/placeholder.jpg';
                const artistaNombreCompleto = `${obra.artista_nombre || obra.AutorNombre || ''} ${obra.artista_apellido || obra.AutorApellido || ''}`.trim();
                const detallesHTML = construirDetallesTecnicos(obra);

                const card = document.createElement('div');
                card.className = 'art-card';
                card.innerHTML = `
                    <div class="art-img" style="background-image: url('${imgSource}'); background-size: cover; background-position: center;" 
                         onclick="abrirModal('${imgSource}', '${(obra.nombre || obra.Nombre || '').replace(/'/g, "\\'")}', '${artistaNombreCompleto.replace(/'/g, "\\'")}', \`${detallesHTML}\`, '${obra.genero_nombre || obra.GeneroNombre || ''}', '${obra.id_obra || obra.id_Obra}')">
                    </div>
                    <div class="art-info">
                        <a href="/artist/profile/${(obra.artista_nombre || '')}${(obra.artista_apellido || '')}" class="author-link">
                            ${artistaNombreCompleto || 'Anónimo'}
                        </a>
                        <h3 class="art-title" style="margin: 10px 0;">${obra.nombre || obra.Nombre || ''}</h3>
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <span class="price">${obra.precio_formateado || obra.PrecioFormateado || ''}</span>
                            <button class="btn-buy" onclick="adquirirObra('${obra.id_obra || obra.id_Obra}', '${(obra.nombre || obra.Nombre || '').replace(/'/g, "\\'")}', '${artistaNombreCompleto.replace(/'/g, "\\'")}', '${obra.precio_formateado || obra.PrecioFormateado || ''}', '${imgSource}')">Adquirir</button>
                        </div>
                    </div>
                `;
                gallery.appendChild(card);
            });
        }

        function renderPagination(total) {
            const container = document.getElementById('pagination');
            const totalPages = Math.max(1, Math.ceil(total / ITEMS_PER_PAGE));
            if (currentPage > totalPages) currentPage = totalPages;

            if (totalPages <= 1) { container.innerHTML = ''; return; }

            let html = '';
            html += `<button ${currentPage === 1 ? 'disabled' : ''} onclick="irPagina(${currentPage - 1})">&laquo; Anterior</button>`;

            const maxVisible = 5;
            let start = Math.max(1, currentPage - Math.floor(maxVisible / 2));
            let end = Math.min(totalPages, start + maxVisible - 1);
            if (end - start + 1 < maxVisible) start = Math.max(1, end - maxVisible + 1);

            if (start > 1) { html += '<button onclick="irPagina(1)">1</button>'; if (start > 2) html += '<span class="page-info">...</span>'; }

            for (let i = start; i <= end; i++)
                html += `<button class="${i === currentPage ? 'active' : ''}" onclick="irPagina(${i})">${i}</button>`;

            if (end < totalPages) { if (end < totalPages - 1) html += '<span class="page-info">...</span>'; html += `<button onclick="irPagina(${totalPages})">${totalPages}</button>`; }

            html += `<button ${currentPage === totalPages ? 'disabled' : ''} onclick="irPagina(${currentPage + 1})">Siguiente &raquo;</button>`;
            container.innerHTML = html;
        }

        async function renderGallery() {
            const genero = document.getElementById('filterGenre').value;
            const artista = document.getElementById('filterAuthor').value;
            const orden = document.getElementById('sortPrice').value;
            isSearching = false;
            currentPage = 1;

            try {
                const data = await CatalogController.getFiltered({ genero, artista, orden, pagina: 1, limite: ITEMS_PER_PAGE });
                allObras = data.obras;
                totalObras = data.total;
                renderCards(allObras);
                renderPagination(totalObras);
            } catch (error) {
                console.error("Error cargando galería:", error);
                gallery.innerHTML = '<p style="text-align:center;">Error al cargar obras.</p>';
            }
        }

        async function irPagina(pagina) {
            currentPage = pagina;

            if (isSearching) {
                const start = (currentPage - 1) * ITEMS_PER_PAGE;
                renderCards(allObras.slice(start, start + ITEMS_PER_PAGE));
                renderPagination(allObras.length);
                return;
            }

            const genero = document.getElementById('filterGenre').value;
            const artista = document.getElementById('filterAuthor').value;
            const orden = document.getElementById('sortPrice').value;

            try {
                const data = await CatalogController.getFiltered({ genero, artista, orden, pagina, limite: ITEMS_PER_PAGE });
                allObras = data.obras;
                totalObras = data.total;
                renderCards(allObras);
                renderPagination(data.total);
            } catch (error) {
                console.error("Error paginando obras:", error);
            }
        }

        // FUNCIÓN CON VERIFICACIÓN DE SESIÓN Y PERMISO DE COMPRA
        async function adquirirObra(id, nombre, artista, precio, imagen) {
            try {
                const data = await AuthController.checkSession();
                if (!data.autenticado) {
                    alert("Debes iniciar sesión para adquirir una obra.");
                    window.location.href = "/login";
                    return;
                }
                if (!data.puedeAdquirir) {
                    alert("Tu cuenta no tiene permitido adquirir obras en este momento. Contacta al administrador.");
                    return;
                }
            } catch (e) {
                console.error("Error verificando sesión:", e);
                window.location.href = "/login";
                return;
            }
            const obra = {
                id_Obra: id,
                nombre: nombre,
                artista: artista,
                precio: precio,
                imagen: imagen
            };
            localStorage.setItem('obraSeleccionada', JSON.stringify(obra));
            window.location.href = "/checkout";
        }

        // Event Listeners
        document.getElementById('sortPrice').addEventListener('change', aplicarFiltros);
        document.getElementById('filterGenre').addEventListener('change', aplicarFiltros);
        document.getElementById('filterAuthor').addEventListener('change', aplicarFiltros);

        async function aplicarFiltros() {
            const query = document.getElementById('buscador').value.trim();
            if (query.length >= 2) {
                buscarObras(query);
            } else {
                renderGallery();
            }
        }

        // Inicialización
        window.onload = () => {
            cargarFiltros();

            // PRIMERO: Abrir modal pendiente
            const dataPendiente = sessionStorage.getItem('abrirObraData');
            const idPendiente = sessionStorage.getItem('abrirObra');

            if (dataPendiente || idPendiente) {
                // Abrir inmediatamente y luego cargar galería
                if (dataPendiente) {
                    sessionStorage.removeItem('abrirObraData');
                    const data = JSON.parse(dataPendiente);
                    RecommendationsController.registerActivity({ idUsuario: 9999, idObra: data.id, tipo: 'vista_detalle' }).catch(() => { });
                    abrirModal(data.imagen, data.nombre, data.artista || '', '', data.genero || '', data.id);
                }
                if (idPendiente) {
                    sessionStorage.removeItem('abrirObra');
                    RecommendationsController.registerActivity({ idUsuario: 9999, idObra: parseInt(idPendiente), tipo: 'vista_detalle' }).catch(() => { });

                    CatalogController.getById(idPendiente)
                        .then(obra => {
                            if (obra && obra.id_obra) {
                                const imgSource = obra.fotografia || obra.imagen_url || '/assets/images/placeholder.jpg';
                                const artistaNombreCompleto = (obra.artista_nombre && obra.artista_apellido) ? obra.artista_nombre + ' ' + obra.artista_apellido : '';
                                const detallesHTML = construirDetallesTecnicos(obra);
                                abrirModal(imgSource, obra.nombre, artistaNombreCompleto, detallesHTML, obra.genero_nombre || '', obra.id_obra);
                            }
                        })
                        .catch(() => { });
                }
            }

            // DESPUÉS: Cargar galería
            renderGallery();
        };

        // Estado de usuario 
        document.addEventListener('DOMContentLoaded', () => {
            AuthController.checkSession()
                .then(data => {
                    const authContainer = document.querySelector('.auth-buttons');
                    const navContainer = document.querySelector('.nav-container');

                    if (data.autenticado) {
                        authContainer.style.display = 'none';

                        AuthController.getCurrentUser()
                            .then(user => {
                                const userDiv = document.createElement('div');
                                userDiv.className = 'user-profile';
                                const panelLink = user.Rol === 'administrador' ? '/admin' : '/dashboard';
                                const panelLabel = user.Rol === 'administrador' ? 'Panel Admin' : 'Mi Feed';
                                userDiv.innerHTML = `
                            <span style="margin-right: 15px; color: #eee; font-size: 0.75rem;">HOLA, ${user.Nombre}</span>
                            <a href="${panelLink}" class="btn-panel">${panelLabel}</a>
                            <a href="/logout" class="btn-logout">Cerrar sesión</a>
                        `;
                                navContainer.appendChild(userDiv);
                            });
                    }
                }).catch(error => console.error('Error al cargar usuario:', error));
        });

        let timeoutBuscador = null;

        async function buscarObras(query) {
            clearTimeout(timeoutBuscador);

            if (!query || query.trim().length < 2) {
                isSearching = false;
                renderGallery();
                return;
            }

            timeoutBuscador = setTimeout(async () => {
                try {
                    const exactas = await CatalogController.search(query).catch(() => []);
                    allObras = exactas;
                    // Aplicar filtros de género y artista sobre los resultados
                    const genero = document.getElementById('filterGenre').value;
                    const artista = document.getElementById('filterAuthor').value;
                    const GENRE_MAP = { 'Fotografia': 'Fotografía' };

                    if (genero !== 'all') {
                        const gf = GENRE_MAP[genero] || genero;
                        allObras = allObras.filter(o => o.genero_nombre === gf);
                    }
                    if (artista !== 'all') {
                        allObras = allObras.filter(o => o.id_artista == artista);
                    }

                    isSearching = true;
                    currentPage = 1;
                    totalObras = allObras.length;
                    irPagina(1);
                } catch (e) {
                    console.error('Error en búsqueda:', e);
                }
            }, 400);
        }
    </script>
</body>

</html>
